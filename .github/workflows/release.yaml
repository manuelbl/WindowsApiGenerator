# Publishes a release when a tag of the form vX.Y.Z is pushed:
# the code generator and the Maven plug-in to Maven Central,
# the Gradle plug-in to the Gradle Plugin Portal.
# See docs/releasing.md for the release process and the one-time setup.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -V -ntp -e -Djansi.passthrough=true -Dstyle.color=always

jobs:

  verify:
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # The environment holds the credentials; it requires approval and only accepts v* tags.
    environment: release

    steps:
    - uses: actions/checkout@v6
    - name: Check version
      run: |
        version="${GITHUB_REF_NAME#v}"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Tag $GITHUB_REF_NAME is not of the form vX.Y.Z"
          exit 1
        fi
        python3 scripts/set_version.py --check "$version"
    - name: Setup JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: maven
        server-id: central
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_PASSWORD
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    # The GPG key is used in memory by the Bouncy Castle signer; no keyring is needed.
    - name: Publish library to Maven Central
      run: mvn -Prelease -Dgpg.signer=bc -DskipTests deploy
      working-directory: ./windowsapi-code-generator
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    - name: Publish Maven plug-in to Maven Central
      run: mvn -Prelease -Dgpg.signer=bc -DskipTests deploy
      working-directory: ./windowsapi-maven-plugin
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    # The code generator is taken from the local Maven repository filled by the first deploy.
    - name: Publish Gradle plug-in to Gradle Plugin Portal
      run: ./gradlew publishPlugins
      working-directory: ./windowsapi-gradle-plugin
      env:
        GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

  draft-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Create draft GitHub release
      run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag
      env:
        GH_TOKEN: ${{ github.token }}
